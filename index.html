<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* --- Khu vực điều khiển (Search, Filter) --- */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* --- Bảng dữ liệu --- */
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: white;
            table-layout: fixed; /* Cố định layout để xử lý text dài */
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
            word-wrap: break-word;
            vertical-align: middle;
        }

        th {
            background-color: #333;
            color: white;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
        }

        /* Logic màu nền: Lẻ trắng, Chẵn đen */
        tbody tr:nth-child(odd) {
            background-color: #ffffff;
            color: #000000;
        }

        tbody tr:nth-child(even) {
            background-color: #000000;
            color: #ffffff;
        }

        /* Xử lý hình ảnh trong bảng */
        .image-gallery {
            display: flex;
            flex-wrap: wrap; /* Cho phép xuống dòng nếu nhiều ảnh */
            gap: 5px;
        }

        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #999;
            background-color: #fff;
        }

        /* Xử lý mô tả dài (chỉ hiện 2 dòng) */
        .truncate-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9em;
        }

        /* --- Phân trang --- */
        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .pagination button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .sort-icon::after {
            content: ' ↕';
            font-size: 0.8em;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên..." style="flex: 1; max-width: 300px;" />

        <label>Hiển thị: 
            <select id="pageSizeSelect">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
            </select>
        </label>
        
        <div style="margin-left: auto; display: flex; gap: 10px;">
            <button onclick="handleSort('price')">Sắp xếp Giá</button>
            <button onclick="handleSort('title')">Sắp xếp Tên</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 50px;">ID</th>
                <th onclick="handleSort('title')" class="sort-icon" style="width: 20%;">Tên sản phẩm</th>
                <th style="width: 30%;">Mô tả</th>
                <th onclick="handleSort('price')" class="sort-icon" style="width: 100px;">Giá ($)</th>
                <th>Hình ảnh (Tất cả)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="pagination" id="pagination">
        </div>

    <script src="script.js"></script>
</body>
</html>
